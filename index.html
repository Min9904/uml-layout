<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UML Class Diagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE work tool, quiet and exact
   IDEA a drafting table at night: charcoal sheet with a faint dot grid, pale ink boxes, a tool tray along the bottom
   PICTURE the live diagram itself, edge to edge, ports and selection in one cool blue
   COLOUR fixed dark: charcoal ground #1b1e24, ink #e6e8ec, blue #4c9dff for ports, selection and choices
   TYPE Space Grotesk 600 for titles and class names + Inter for members and controls
   LAYOUT slim title bar, canvas fills, inspector floats top-right, tray at bottom; phones: tray scrolls sideways, inspector becomes a bottom sheet */
:root{color-scheme:dark;--bg:#15171c;--ink:#e6e8ec;--mut:#9aa3b2;--paper:#1b1e24;--card:#23272f;--head:#2c323c;--note:#3a3520;--dot:#2e333d;--acc:#4c9dff;--line:#333a46;--tray:#101216;--red:#ff6b5e}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.top{display:flex;align-items:center;gap:16px;padding:8px max(16px,2vw);border-bottom:1px solid var(--line)}
h1{font:600 22px/1.05 'Space Grotesk',Inter,sans-serif;letter-spacing:-.02em;margin:0;white-space:nowrap}
.hint{margin:0;color:var(--mut);font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sync{font-size:13px;color:var(--mut);white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.zoom{display:flex;align-items:center;gap:4px;margin-left:auto}
.zoom span{width:52px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px;color:var(--mut)}
.zoom button{min-width:40px;height:40px;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;padding:0 10px}
.zoom button:hover{border-color:var(--acc)}
#stage{position:relative;overflow:hidden}
#svg{position:absolute;inset:0;width:100%;height:100%;background:var(--paper);touch-action:none;user-select:none;-webkit-user-select:none;display:block}
#svg.panning{cursor:grabbing}
[data-s]{cursor:move}
[data-e]{cursor:pointer}
[data-port]{cursor:crosshair}
[data-end]{cursor:grab}
[data-vis]{cursor:pointer}
#ov{position:absolute;inset:0;pointer-events:none}
.ed{position:absolute;pointer-events:auto;border:2px solid var(--acc);background:var(--card);color:var(--ink);padding:4px 10px;resize:none;outline:none;font-family:Inter,sans-serif;box-shadow:0 6px 18px rgb(0 0 0/.4);overflow:hidden}
#empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--mut);font-size:16px;text-align:center;padding:24px}
.panel{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgb(0 0 0/.45);padding:14px}
#insp{top:12px;right:12px;width:min(290px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;display:grid;gap:6px}
.ih{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
h2{font:600 17px/1.2 'Space Grotesk',Inter,sans-serif;margin:0}
h3{font:600 15px/1.2 'Space Grotesk',Inter,sans-serif;margin:0 0 8px}
.x{width:36px;height:36px;border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;border-radius:8px;color:var(--mut)}
.x:hover{background:var(--head);color:var(--ink)}
label{font-size:13px;color:var(--mut);margin-top:4px}
input,select,textarea{width:100%;font-size:16px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
textarea{resize:vertical;font-size:14px;line-height:1.45}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);margin-top:8px}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--acc)}
.tip{font-size:13px;color:var(--mut);margin:4px 0 0}
code{font-size:13px;background:var(--head);padding:0 4px;border-radius:4px}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row button,.file{flex:1;min-height:42px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink);margin:0;white-space:nowrap}
.row button:hover,.file:hover{border-color:var(--acc)}
.row button:disabled{opacity:.5;cursor:default}
.row .danger{color:var(--red)}
.row .pri{background:var(--acc);border-color:var(--acc);color:#06121f;font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.two label{display:grid;gap:4px}
.ends{margin:0;font-size:14px}
.file input{display:none}
#pop{width:min(660px,calc(100% - 16px));z-index:5}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:8px;margin-top:6px}
.opt{display:grid;gap:2px;justify-items:start;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px 10px;cursor:pointer;color:var(--ink)}
.opt:hover,.opt:focus-visible{border-color:var(--acc);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 35%,transparent)}
.opt svg{width:100%;height:auto;margin-bottom:4px;overflow:visible}
.on{font-weight:600;font-size:14px}
.os{font-size:13px;color:var(--mut);overflow-wrap:anywhere}
.pt{font-size:13px;color:var(--mut);margin:10px 0 0}
.ovl{position:absolute;inset:0;background:rgb(0 0 0/.5);display:grid;place-items:center;padding:12px;z-index:6}
.ovl .panel{position:relative;width:min(840px,100%);max-height:100%;overflow:auto}
.mg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
#m-img{display:block;width:100%;max-height:280px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.rules{margin:0;padding-left:20px;font-size:14px;display:grid;gap:6px}
.tray{background:var(--tray);color:#eef1f5;display:flex;gap:6px;align-items:center;padding:8px max(12px,2vw);overflow-x:auto;scrollbar-width:thin;border-top:1px solid var(--line)}
.tray button{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid rgb(255 255 255/.12);background:rgb(255 255 255/.04);color:inherit;cursor:pointer;font-size:14px}
.tray button:hover{border-color:var(--acc);background:rgb(255 255 255/.08)}
.tray button:disabled{opacity:.4;cursor:default}
.tray .add{background:color-mix(in srgb,var(--acc) 16%,transparent);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.tray .ai{border-color:var(--acc)}
.tray svg{width:26px;height:22px;flex:none}
.sep{width:1px;align-self:stretch;background:rgb(255 255 255/.14);margin:4px 6px;flex:none}
#toast{position:absolute;left:50%;bottom:14px;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
@media(max-width:860px){.hint{display:none}}
@media(max-width:600px){#insp{top:auto;bottom:8px;left:8px;right:8px;width:auto;max-height:48%}.mg{grid-template-columns:minmax(0,1fr)}h1{font-size:19px}.zoom span,#sync{display:none}}
</style>
</head>
<body>
<div id="app">
<header class="top">
<h1>Class diagram</h1>
<p class="hint">Drag a blue port onto another box to connect. Click a − # ~ + symbol to change it. Double-click text to edit.</p>
<div class="zoom"><button id="z-out" aria-label="Zoom out">−</button><span id="zl">100%</span><button id="z-in" aria-label="Zoom in">+</button><button id="z-fit">Fit</button></div>
</header>
<main id="stage">
<svg id="svg" role="application" aria-label="Diagram canvas"><defs id="defs"><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.1" fill="var(--dot)"/></pattern></defs><rect width="100%" height="100%" fill="url(#grid)"/><g id="world"></g></svg>
<div id="empty" hidden>Empty canvas. Add a class from the tray below.</div>
<div id="ov"></div>
<aside id="insp" class="panel" hidden></aside>
<div id="pop" class="panel" hidden role="dialog" aria-label="Choose relationship"></div>
<div id="modal" class="ovl" hidden><div class="panel" role="dialog" aria-labelledby="m-h">
<div class="ih"><h2 id="m-h">Export and import</h2><button class="x" id="m-x" aria-label="Close">×</button></div>
<div class="mg">
<section><h3>Picture</h3><img id="m-img" alt="PNG preview of the diagram"><label class="chk"><input type="checkbox" id="m-light"> White background for printing</label>
<div class="row" id="m-dl"><button id="d-png" class="pri">Download PNG</button><button id="d-svg">Download SVG</button><button id="d-json">Download JSON</button></div>
<div class="row"><button id="m-svg">Copy SVG</button><button id="m-json">Copy JSON</button></div></section>
<section><h3>Import</h3><textarea id="m-in" rows="8" placeholder="Paste diagram JSON here, saved from this editor or written as a spec" spellcheck="false"></textarea><div class="row"><label class="file">Open .json file<input type="file" id="m-file" accept=".json,application/json"></label><button id="m-load" class="pri">Load</button></div><p id="m-msg" class="tip" aria-live="polite"></p></section>
</div></div></div>
<div id="toast" aria-live="polite"></div>
</main>
<footer class="tray">
<button class="add" data-add="class"><svg viewBox="0 0 26 22" aria-hidden="true"><rect x="1" y="1" width="24" height="20" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1 8H25M1 14H25" stroke="currentColor" stroke-width="1.2"/></svg>Class</button>
<button class="add" data-add="abstract"><svg viewBox="0 0 26 22" aria-hidden="true"><rect x="1" y="1" width="24" height="20" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="13" y="16" text-anchor="middle" font-size="13" font-style="italic" font-weight="600" fill="currentColor">A</text></svg>Abstract</button>
<button class="add" data-add="interface"><svg viewBox="0 0 26 22" aria-hidden="true"><rect x="1" y="1" width="24" height="20" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="13" y="16" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">«I»</text></svg>Interface</button>
<button class="add" data-add="enum"><svg viewBox="0 0 26 22" aria-hidden="true"><rect x="1" y="1" width="24" height="20" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 8H20M6 12H20M6 16H20" stroke="currentColor" stroke-width="1.2"/></svg>Enum</button>
<button class="add" data-add="note"><svg viewBox="0 0 26 22" aria-hidden="true"><path d="M1 1H18L25 8V21H1Z M18 1V8H25" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>Note</button>
<span class="sep"></span>
<button id="b-tidy">Tidy</button>
<span class="sep"></span>
<button id="b-undo">Undo</button>
<button id="b-redo">Redo</button>
<button id="b-del">Delete</button>
<span class="sep"></span>
<button id="b-exp">Export / import</button>
<button id="b-clear">Clear</button>
</footer>
</div>
<script>
{
const $=id=>document.getElementById(id);
const svg=$('svg'),world=$('world'),stage=$('stage'),insp=$('insp'),pop=$('pop'),ov=$('ov'),modal=$('modal'),toastEl=$('toast');
const LH=18,PAD=8,PX=12,G=24,MINW=150,GAPX=100,GAPY=110,MAXROW=5,KEY='uml-class-diagram-v1';
const F={disp:"'Space Grotesk', Inter, Arial, sans-serif",text:"Inter, Arial, sans-serif"};
const KINDS={class:{label:'Class',st:''},abstract:{label:'Abstract class',st:'abstract',it:true},interface:{label:'Interface',st:'interface'},enum:{label:'Enum',st:'enumeration'},note:{label:'Note',note:true}};
const cut=s=>{s=s||'?';return s.length>14?s.slice(0,13)+'…':s};
const RELS=[
{k:'assoc',name:'Association',say:(a,b)=>`${a} is linked to ${b}`},
{k:'directed',name:'Directed association',e:'open',say:(a,b)=>`${a} knows about ${b}`},
{k:'inherit',name:'Inheritance',e:'tri',say:(a,b)=>`${a} extends ${b}`},
{k:'realize',name:'Realization',e:'tri',dash:1,say:(a,b)=>`${a} implements ${b}`},
{k:'depend',name:'Dependency',e:'open',dash:1,say:(a,b)=>`${a} uses ${b}`},
{k:'agg',name:'Aggregation',s:'dia',say:(a,b)=>`${a} has ${b}; parts can outlive it`},
{k:'comp',name:'Composition',s:'diaf',say:(a,b)=>`${a} owns ${b}; parts die with it`},
{k:'note',name:'Note link',dash:1,say:()=>'attaches the note'}];
const REL=Object.fromEntries(RELS.map(r=>[r.k,r]));
const GEN=new Set(['inherit','realize']);
const LIVE={ink:'var(--ink)',mut:'var(--mut)',paper:'var(--paper)',card:'var(--card)',head:'var(--head)',note:'var(--note)',acc:'var(--acc)'};
const DARK={ink:'#e6e8ec',mut:'#9aa3b2',paper:'#1b1e24',card:'#23272f',head:'#2c323c',note:'#3a3520',acc:'#4c9dff'};
const LIGHT={ink:'#0b0b10',mut:'#4b5563',paper:'#ffffff',card:'#ffffff',head:'#eef1f5',note:'#fff6d3',acc:'#2563eb'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ctx=document.createElement('canvas').getContext('2d');
const tw=(t,f)=>{ctx.font=f;return ctx.measureText(t).width};
const snap=v=>Math.round(v/10)*10;
const n1=v=>+v.toFixed(1);

let S={shapes:[],edges:[],nid:1},view={tx:40,ty:40,s:1},sel=null,hover=null,drag=null,pending=null,ed=null,pendEdit=null;
let hist=[],hi=-1,last={k:'',t:0,x:0,y:0},LC=new WeakMap();

function mk(pre,ink,fill){
const m=(id,w,h,rx,ry,body)=>`<marker id="${pre}-${id}" markerUnits="userSpaceOnUse" markerWidth="${w}" markerHeight="${h}" refX="${rx}" refY="${ry}" orient="auto-start-reverse" overflow="visible">${body}</marker>`;
const dia='M1,7 L11,1 L21,7 L11,13 Z';
return m('open',14,14,13,7,`<path d="M1,1 L13,7 L1,13" fill="none" stroke="${ink}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>`)
+m('tri',16,18,15,9,`<path d="M1,1 L15,9 L1,17 Z" fill="${fill}" stroke="${ink}" stroke-width="1.5" stroke-linejoin="round"/>`)
+m('dia',22,14,21,7,`<path d="${dia}" fill="${fill}" stroke="${ink}" stroke-width="1.5" stroke-linejoin="round"/>`)
+m('diaf',22,14,21,7,`<path d="${dia}" fill="${ink}" stroke="${ink}" stroke-width="1.5" stroke-linejoin="round"/>`);
}
$('defs').insertAdjacentHTML('beforeend',mk('m','var(--ink)','var(--paper)')+mk('ms','var(--acc)','var(--paper)')+mk('mi','var(--ink)','var(--card)'));

const byId=id=>S.shapes.find(s=>s.id===id);
const edgeById=id=>S.edges.find(e=>e.id===id);
const newId=p=>p+(S.nid++);

/* members and visibility */
const VIS=['-','#','~','+'],VISNAME={'-':'private','#':'protected','~':'package','+':'public'},VRE=/^\s*([+\-#~])\s*/;
const hv=(sh,f)=>!KINDS[sh.kind].note&&!(sh.kind==='enum'&&f==='attrs');
function mem(t,vis){const out=[];String(t).split('\n').forEach((s,idx)=>{if(!s.trim())return;let u=false,i=false,m=s.match(VRE),v=null;
if(m){s=s.slice(m[0].length);if(vis)v=m[1];}else{s=s.trim();if(vis)v='-';}
while((m=s.match(/^(static|abstract)\s+/))){if(m[1]==='static')u=true;else i=true;s=s.slice(m[0].length);}
out.push({v,t:s.replace(/\s+$/,''),u,i,idx});});return out;}
function norm(sh){for(const f of ['attrs','methods'])if(hv(sh,f))sh[f]=String(sh[f]).split('\n').map(l=>!l.trim()||VRE.test(l)?l:'- '+l.trim()).join('\n');}
function cycleVis(id,f,idx){const sh=byId(id);if(!sh)return;const ls=String(sh[f]).split('\n'),l=ls[idx];if(l==null)return;const m=l.match(VRE),c=m?m[1]:'-';
ls[idx]=VIS[(VIS.indexOf(c)+1)%4]+' '+(m?l.slice(m[0].length):l.trim());sh[f]=ls.join('\n');commit();syncInsp();render();toast(VISNAME[ls[idx][0]]);}

function lay(sh){
const key=sh.kind+'\u0001'+sh.name+'\u0001'+sh.attrs+'\u0001'+sh.methods,c=LC.get(sh);if(c&&c.key===key)return c.L;
const L=lay0(sh);LC.set(sh,{key,L});return L;}
function lay0(sh){
const k=KINDS[sh.kind];
if(k.note){const ls=String(sh.attrs).split('\n');const w=Math.max(160,...ls.map(l=>tw(l,`13px ${F.text}`)+PX*2+14));const h=Math.max(60,ls.length*LH+PAD*2+4);const W=Math.ceil(w/10)*10,H=Math.ceil(h/10)*10;return{w:W,h:H,note:true,ls,comps:[{f:'attrs',y:0,h:H}]};}
const st=k.st?`«${k.st}»`:'',hh=PAD*2+(st?LH:0)+20,A=mem(sh.attrs,hv(sh,'attrs')),M=mem(sh.methods,true);
const ah=Math.max(16,A.length*LH+PAD),mh=Math.max(16,M.length*LH+PAD);
const w=Math.ceil(Math.max(MINW,tw(sh.name||' ',`600 15px ${F.disp}`)+PX*2,st?tw(st,`13px ${F.text}`)+PX*2:0,...A.concat(M).map(m=>tw(m.t,`${m.i?'italic ':''}13px ${F.text}`)+PX*2+(m.v?16:0)))/10)*10;
return{w,h:hh+ah+mh,st,hh,ah,mh,A,M,it:!!k.it,comps:[{f:'name',y:0,h:hh},{f:'attrs',y:hh,h:ah},{f:'methods',y:hh+ah,h:mh}]};
}
function port(sh,L,p){const t=(p.i+1)/4;
switch(p.side){case 0:return{x:sh.x+L.w*t,y:sh.y,dx:0,dy:-1};case 1:return{x:sh.x+L.w,y:sh.y+L.h*t,dx:1,dy:0};case 2:return{x:sh.x+L.w*t,y:sh.y+L.h,dx:0,dy:1};default:return{x:sh.x,y:sh.y+L.h*t,dx:-1,dy:0};}}

/* routing: horizontal and vertical segments only, 90° corners, avoids boxes */
const eq=(a,b)=>Math.abs(a-b)<.01;
function simp(a){const o=[];for(const p of a){const q=o[o.length-1];if(q&&eq(q.x,p.x)&&eq(q.y,p.y))continue;o.push({x:p.x,y:p.y});}
for(let i=1;i<o.length-1;){const A=o[i-1],B=o[i],C=o[i+1];if((eq(A.x,B.x)&&eq(B.x,C.x))||(eq(A.y,B.y)&&eq(B.y,C.y)))o.splice(i,1);else i++;}return o;}
function hit(a,b,r){const e=1;if(eq(a.y,b.y))return a.y>r.y+e&&a.y<r.y+r.h-e&&Math.max(a.x,b.x)>r.x+e&&Math.min(a.x,b.x)<r.x+r.w-e;
return a.x>r.x+e&&a.x<r.x+r.w-e&&Math.max(a.y,b.y)>r.y+e&&Math.min(a.y,b.y)<r.y+r.h-e;}
function rects(){return S.shapes.map(s=>{const L=lay(s);return{id:s.id,x:s.x,y:s.y,w:L.w,h:L.h};});}
function clash(a,b,used,tk){let s=0;const hz=eq(a.y,b.y);
for(const u of used){if(tk&&u.tk===tk)continue;const c=u.a,d=u.b,uh=eq(c.y,d.y);
if(hz&&uh&&Math.abs(a.y-c.y)<8){const o=Math.min(Math.max(a.x,b.x),Math.max(c.x,d.x))-Math.max(Math.min(a.x,b.x),Math.min(c.x,d.x));if(o>.5)s+=300+o*4;}
else if(!hz&&!uh&&Math.abs(a.x-c.x)<8){const o=Math.min(Math.max(a.y,b.y),Math.max(c.y,d.y))-Math.max(Math.min(a.y,b.y),Math.min(c.y,d.y));if(o>.5)s+=300+o*4;}
else if(hz!==uh){const H=hz?[a,b]:[c,d],V=hz?[c,d]:[a,b];const y=H[0].y,x=V[0].x;
if(x>Math.min(H[0].x,H[1].x)+.5&&x<Math.max(H[0].x,H[1].x)-.5&&y>Math.min(V[0].y,V[1].y)+.5&&y<Math.max(V[0].y,V[1].y)-.5)s+=40;}}
return s;}
function score(raw,pts,p1,p2,ra,rb,obs,used,tk){let s=0;
for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];s+=Math.abs(b.x-a.x)+Math.abs(b.y-a.y);
for(const o of obs)if(hit(a,b,o))s+=(o.id===ra.id||o.id===rb.id)?3000:1200;
if(used&&used.length)s+=clash(a,b,used,tk);}
s+=(pts.length-2)*20;
const dir=(a,b)=>({x:Math.sign(Math.round(b.x-a.x)),y:Math.sign(Math.round(b.y-a.y))});

render();});
svg.addEventListener('pointermove',ev=>{const w=toW(ev);
if(!drag){const h=shapeAt(w,12),id=h?h.id:null;if(id!==hover){hover=id;render();}return;}
if(drag.mode==='pan'){view.tx=drag.tx+ev.clientX-drag.sx;view.ty=drag.ty+ev.clientY-drag.sy;applyView();return;}
if(drag.mode==='move'){const sh=byId(drag.id),nx=snap(w.x-drag.ox),ny=snap(w.y-drag.oy);if(sh&&(nx!==sh.x||ny!==sh.y)){sh.x=nx;sh.y=ny;drag.moved=true;render();}return;}
if(drag.mode==='conn'||drag.mode==='re'){drag.cur=w;const sh=shapeAt(w,16);let t=sh?nearPort(sh,w):null;
if(drag.mode==='conn'&&same(t,drag.from))t=null;
if(drag.mode==='re'){const e=edgeById(drag.eid);if(e&&same(t,drag.end==='from'?e.to:e.from))t=null;}
drag.tgt=t;render();}});
svg.addEventListener('pointerup',ev=>{const d=drag;drag=null;svg.classList.remove('panning');if(!d)return;
if(d.mode==='move'&&d.moved)commit();
if(d.mode==='conn'&&d.tgt){const A=byId(d.from.id),B=byId(d.tgt.id);
if(KINDS[A.kind].note||KINDS[B.kind].note)addEdge('note',d.from,d.tgt);
else{pending={from:d.from,to:d.tgt};render();showPop(ev.clientX,ev.clientY);return;}}
if(d.mode==='re'&&d.tgt){const e=edgeById(d.eid);if(e){e[d.end]=d.tgt;commit();showInsp();}}
if(pendEdit){const p=pendEdit;pendEdit=null;setTimeout(()=>{if(p.shape)openEdit(p.shape,p.w);else{const l=$('i-label');if(l)l.focus();}},0);}
render();});
svg.addEventListener('pointercancel',()=>{drag=null;svg.classList.remove('panning');render();});
svg.addEventListener('pointerleave',()=>{if(!drag&&hover){hover=null;render();}});
svg.addEventListener('wheel',ev=>{ev.preventDefault();const r=svg.getBoundingClientRect();zoomAt(ev.clientX-r.left,ev.clientY-r.top,Math.exp(-ev.deltaY*.0015));},{passive:false});
svg.addEventListener('contextmenu',ev=>ev.preventDefault());

/* relationship picker */
function icon(r){const box=(x,l)=>`<rect x="${x}" y="8" width="32" height="24" fill="var(--card)" stroke="var(--ink)" stroke-width="1.25"/><text x="${x+16}" y="24.5" text-anchor="middle" font-size="13" font-weight="600" font-family="${F.text}" fill="var(--ink)">${l}</text>`;
return box(1,'A')+box(99,'B')+`<path d="M33,20 H99" fill="none" stroke="var(--ink)" stroke-width="1.5"${r.dash?' stroke-dasharray="6 4"':''}${r.s?` marker-start="url(#mi-${r.s})"`:''}${r.e?` marker-end="url(#mi-${r.e})"`:''}/>`;}
function showPop(cx,cy){const A=byId(pending.from.id),B=byId(pending.to.id),an=cut(A.name),bn=cut(B.name);
const list=RELS.filter(r=>r.k!=='note');
pop.innerHTML=`<div class="ih"><h2>Connect ${esc(an)} → ${esc(bn)}</h2><button class="x" id="p-x" aria-label="Cancel">×</button></div><div class="opts">${list.map((r,i)=>`<button class="opt" data-k="${r.k}"><svg viewBox="0 0 132 40" aria-hidden="true">${icon(r)}</svg><span class="on">${i+1}. ${r.name}</span><span class="os">${esc(r.say(an,bn))}</span></button>`).join('')}</div><p class="pt">A is where you started dragging (${esc(an)}). Press 1–7 to pick, Esc to cancel.</p>`;
pop.hidden=false;const r=stage.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;
pop.style.left=Math.max(8,Math.min(cx-r.left+12,r.width-pw-8))+'px';pop.style.top=Math.max(8,Math.min(cy-r.top+12,r.height-ph-8))+'px';
pop.querySelector('.opt').focus({preventScroll:true});}
function cancelPending(){pending=null;pop.hidden=true;render();}
pop.addEventListener('click',ev=>{if(ev.target.closest('#p-x')){cancelPending();return;}const b=ev.target.closest('.opt');if(!b||!pending)return;const p=pending;pending=null;pop.hidden=true;addEdge(b.dataset.k,p.from,p.to);});

/* export and import */
const pal=()=>$('m-light').checked?LIGHT:DARK;
function exportSVG(P){const b=bounds();if(!b)return'';const pad=30,W=Math.ceil(b.w+pad*2),H=Math.ceil(b.h+pad*2),x=Math.floor(b.x-pad),y=Math.floor(b.y-pad);
return`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="${x} ${y} ${W} ${H}"><defs>${mk('x',P.ink,P.paper)}</defs><rect x="${x}" y="${y}" width="${W}" height="${H}" fill="${P.paper}"/>${drawDiagram(P,{ui:false})}</svg>`;}
function pngBlob(P){return new Promise((res,rej)=>{const str=exportSVG(P);if(!str){rej(new Error('empty'));return;}
const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas'),k=2;c.width=im.width*k;c.height=im.height*k;const g=c.getContext('2d');g.scale(k,k);g.drawImage(im,0,0);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png');}catch(e){rej(e);}};
im.onerror=rej;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str);});}
let prevURL=null;
function makePreview(){const img=$('m-img');img.style.background=pal().paper;pngBlob(pal()).then(b=>{if(prevURL)URL.revokeObjectURL(prevURL);prevURL=URL.createObjectURL(b);img.src=prevURL;}).catch(e=>{console.warn('preview failed',e&&e.message||e);img.removeAttribute('src');});}
async function copy(text,what){const msg=$('m-msg');try{await navigator.clipboard.writeText(text);msg.textContent=what+' copied to the clipboard.';}catch(e){$('m-in').value=text;$('m-in').select();msg.textContent='The clipboard was blocked, so the '+what+' is in the import box, selected. Copy it from there.';}}
function dl(kind){const msg=$('m-msg');if(!S.shapes.length)return;
const go=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);msg.textContent=name+' saved.';};
try{if(kind==='png')pngBlob(pal()).then(b=>go(b,'class-diagram.png')).catch(()=>{msg.textContent='The download did not work. Use Copy instead.';});
else if(kind==='svg')go(new Blob([exportSVG(pal())],{type:'image/svg+xml'}),'class-diagram.svg');
else go(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),'class-diagram.json');}
catch(e){msg.textContent='The download did not work. Use Copy instead.';}}
function openModal(){modal.hidden=false;$('m-msg').textContent='';makePreview();$('m-x').focus();}
function closeModal(){modal.hidden=true;}
$('m-x').onclick=closeModal;
modal.addEventListener('pointerdown',ev=>{if(ev.target===modal)closeModal();});
$('m-light').onchange=makePreview;
$('m-svg').onclick=()=>copy(exportSVG(pal()),'SVG');
$('m-json').onclick=()=>copy(JSON.stringify(S,null,1),'JSON');
$('d-png').onclick=()=>dl('png');$('d-svg').onclick=()=>dl('svg');$('d-json').onclick=()=>dl('json');
$('m-file').onchange=ev=>{const f=ev.target.files[0];if(!f)return;f.text().then(t=>{$('m-in').value=t;$('m-msg').textContent=f.name+' read. Press Load.';});};
$('m-load').onclick=()=>{let o=null,raw=null;try{raw=JSON.parse($('m-in').value);}catch(e){}
let spec=false;if(raw){o=sanitize(raw);if(!o&&raw.classes){o=fromSpec(raw);spec=true;}}
if(!o){$('m-msg').textContent="That isn't diagram JSON from this editor or a spec.";return;}
S=o;if(spec)tidy();select(null);commit();closeModal();fit();toast('Diagram loaded');};

/* tray and keys */
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addShape(b.dataset.add));
$('b-undo').onclick=undo;$('b-redo').onclick=redo;$('b-del').onclick=del;$('b-exp').onclick=openModal;
$('b-tidy').onclick=()=>{if(!S.shapes.length)return;tidy();commit();fit();toast('Tidied. Undo puts it back.');};
$('b-clear').onclick=()=>{if(!S.shapes.length)return;S={shapes:[],edges:[],nid:S.nid};select(null);commit();render();toast('Canvas cleared. Undo brings it back.');};
$('z-in').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1.2);};
$('z-out').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1/1.2);};
$('z-fit').onclick=fit;
window.addEventListener('keydown',ev=>{
if(!pop.hidden){if(ev.key==='Escape'){ev.preventDefault();cancelPending();return;}const n=+ev.key,o=pop.querySelectorAll('.opt');if(n>=1&&n<=o.length){ev.preventDefault();o[n-1].click();}return;}
if(!modal.hidden){if(ev.key==='Escape')closeModal();return;}
const tg=ev.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
const mod=ev.ctrlKey||ev.metaKey,k=ev.key.toLowerCase();
if(mod&&k==='z'){ev.preventDefault();ev.shiftKey?redo():undo();}
else if(mod&&k==='y'){ev.preventDefault();redo();}
else if(mod&&k==='d'){ev.preventDefault();dup();}
else if((ev.key==='Delete'||ev.key==='Backspace')&&sel){ev.preventDefault();del();}
else if(ev.key==='Escape'){select(null);render();}
else if(ev.key==='Enter'&&sel&&sel.t==='shape'){ev.preventDefault();openEdit(sel.id,null);}});

function start(d){S=sanitize(d)||loadLocal();if(!S){S=sanitize(SAMPLE);tidy();}hist=[JSON.stringify(S)];hi=0;save();updBtns();showInsp();render();
requestAnimationFrame(fit);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{LC=new WeakMap();render();});
}
start({});
}
</script>
</body>
</html>
